# ColaChess 工作区关联的 AVD（API 34 / Android 14）
api_level=34
platform=android-34

# 分布式：16G 本机只跑手机；32G zts014 跑平板+电视（ssh zts014）
host.phone=local
host.tablet=zts014
host.tv=zts014

# zts006 减轻「Emulator 无响应」：手机 RAM 1536M + KVM host 渲染（见 scripts/cola-phone-restart-light.sh）
emulator.phone.ram=1536M
emulator.phone.gpu=host
emulator.phone.no_audio=1
# zts014 桌面窗口：scripts/cola-emulator-zts014-gui.sh（COLA_EMULATOR_HEADLESS=0）
emulator.zts014.gui=1

avd.phone=ColaChess_Phone
avd.phone.device=pixel_8
avd.phone.image=system-images;android-34;google_apis;x86_64

avd.tablet=ColaChess_Tablet
avd.tablet.device=pixel_tablet
avd.tablet.image=system-images;android-34;google_apis;x86_64

avd.tv=ColaChess_TV
avd.tv.device=tv_1080p
avd.tv.image=system-images;android-34;android-tv;x86

package=com.anglc.colachess
activity=org.petero.droidfish.DroidFish